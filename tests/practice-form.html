
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Automation Practice Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    #result {
      display: none;
      color: red;
      margin-top: 15px;
    }

    #result.visible {
      display: block;
    }
  </style>
</head>

<body>
  <h1>Practice Form</h1>

  <form id="practiceForm">
    <label for="fname">First name</label>
    <input id="fname" name="fname" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="email">

    <button type="submit">Submit</button>
  </form>

  <p id="result" role="alert"></p>

  <script>
    const form = document.querySelector("#practiceForm");
    const result = document.querySelector("#result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const firstName = document.querySelector("#fname").value.trim();
      const email = document.querySelector("#email").value.trim();

      if (!firstName || !email) {
        result.textContent = "Please complete all fields";
        result.classList.add("visible");
      } else {
        result.textContent = "Form submitted successfully!";
        result.classList.add("visible");
        result.style.color = "green";
      }
    });
  </script>
</body>
</html>
